name: Phoenix VR Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Test code and production web bundle
        run: |
          npm test
          node --check src/main.js
          node --check src/avatar-core.mjs
          npm run build
      - name: Generate Android app
        run: npx cap add android
      - name: Assemble debug APK
        run: npm run android:apk
      - name: Validate built APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -2
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-VR-Avatar-Studio-debug
          if-no-files-found: error
          retention-days: 30
          path: android/app/build/outputs/apk/debug/app-debug.apk
